name: CI

on:
  pull_request:
    branches:
      - dev
      - main
      - prod
  push:
    branches:
      - feat
      - dev
      - main
      - prod
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-context:
    name: Branch context
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.context.outputs.environment }}
      app_url: ${{ steps.context.outputs.app_url }}

    steps:
      - name: Resolve environment
        id: context
        shell: bash
        run: |
          BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"

          if [ "$BRANCH" = "prod" ] || [ "$BRANCH" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "app_url=https://khoobrooz.com" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = "dev" ]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "app_url=https://dev.khoobrooz.com" >> "$GITHUB_OUTPUT"
          else
            echo "environment=feature" >> "$GITHUB_OUTPUT"
            echo "app_url=http://localhost:3000" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    needs: branch-context
    env:
      APP_ENVIRONMENT: ${{ needs.branch-context.outputs.environment }}
      APP_URL: ${{ needs.branch-context.outputs.app_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - branch-context
      - quality
    env:
      APP_ENVIRONMENT: ${{ needs.branch-context.outputs.environment }}
      APP_URL: ${{ needs.branch-context.outputs.app_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: khoobrooz-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
