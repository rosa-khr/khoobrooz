services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: khoobrooz-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:-ChangeThisStrongPassword!2026}
      TZ: Asia/Tehran
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - khoobrooz_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  khoobrooz_sqlserver_data:
