services:
  khoobrooz-api:
    image: node:22-alpine
    container_name: khoobrooz-api
    restart: unless-stopped
    working_dir: /app
    command: node backend/dev-tgju-server.mjs
    environment:
      NODE_ENV: production
      BACKEND_PORT: 8000
      TZ: Asia/Tehran
      DB_DRIVER: mysql
      DB_HOST: khoobrooz-mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-khoobrooz}
      DB_USERNAME: ${MYSQL_USER:-khoobrooz}
      DB_PASSWORD: ${MYSQL_PASSWORD:-khoobrooz_dev_2026}
      TGJU_API_URL: ${TGJU_API_URL:-https://call2.tgju.org/ajax.json?rev=E0Wf6KUzcINqAprSkiDbnhZHdM4XGIMImkivgesQwwcAXNQ2RlfNvH4d29bM}
      TGJU_SYNC_INTERVAL_MS: ${TGJU_SYNC_INTERVAL_MS:-7200000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - .:/app:ro
    depends_on:
      khoobrooz-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/v1/market-rates/board').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  khoobrooz-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: khoobrooz-web:latest
    container_name: khoobrooz-web
    restart: unless-stopped
    depends_on:
      khoobrooz-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Asia/Tehran
      BACKEND_API_URL: http://khoobrooz-api:8000/api/v1
    ports:
      - "${APP_PORT:-3000}:3000"

  khoobrooz-mysql:
    image: mysql:8.4
    container_name: khoobrooz-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-khoobrooz}
      MYSQL_USER: ${MYSQL_USER:-khoobrooz}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-khoobrooz_dev_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ChangeThisStrongPassword!2026}
      TZ: Asia/Tehran
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - khoobrooz_mysql_data:/var/lib/mysql
      - ./database-design/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  khoobrooz_mysql_data:
