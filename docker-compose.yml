services:
  khoobrooz-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: khoobrooz-api:latest
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      BACKEND_PORT: 8000
      TZ: Asia/Tehran
      DB_DRIVER: mysql
      DB_HOST: khoobrooz-mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE must be set}
      DB_USERNAME: ${MYSQL_USER:?MYSQL_USER must be set}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      TGJU_API_URL: ${TGJU_API_URL:-https://call2.tgju.org/ajax.json?rev=E0Wf6KUzcINqAprSkiDbnhZHdM4XGIMImkivgesQwwcAXNQ2RlfNvH4d29bM}
      TGJU_SYNC_INTERVAL_MS: ${TGJU_SYNC_INTERVAL_MS:-7200000}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    networks:
      - frontend
      - backend
    depends_on:
      khoobrooz-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  khoobrooz-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: khoobrooz-web:latest
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      khoobrooz-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Asia/Tehran
      BACKEND_API_URL: http://khoobrooz-api:8000/api/v1
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    networks:
      - frontend

  khoobrooz-mysql:
    image: mysql:8.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE must be set}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER must be set}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      TZ: Asia/Tehran
    volumes:
      - khoobrooz_mysql_data:/var/lib/mysql
      - ./database-design/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  khoobrooz_mysql_data:

networks:
  frontend:
  backend:
    internal: true
