services:
  khoobrooz-api:
    image: node:22-alpine
    container_name: khoobrooz-api
    restart: unless-stopped
    working_dir: /app
    command: node backend/dev-tgju-server.mjs
    environment:
      NODE_ENV: production
      BACKEND_PORT: 8000
      TZ: Asia/Tehran
      TGJU_API_URL: ${TGJU_API_URL:-https://call2.tgju.org/ajax.json?rev=E0Wf6KUzcINqAprSkiDbnhZHdM4XGIMImkivgesQwwcAXNQ2RlfNvH4d29bM}
      TGJU_SYNC_INTERVAL_MS: ${TGJU_SYNC_INTERVAL_MS:-7200000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - .:/app:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/v1/market-rates/board').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  khoobrooz-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: khoobrooz-web:latest
    container_name: khoobrooz-web
    restart: unless-stopped
    depends_on:
      khoobrooz-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Asia/Tehran
      BACKEND_API_URL: http://khoobrooz-api:8000/api/v1
    ports:
      - "${APP_PORT:-3000}:3000"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: khoobrooz-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:-ChangeThisStrongPassword!2026}
      TZ: Asia/Tehran
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - khoobrooz_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  khoobrooz_sqlserver_data:
